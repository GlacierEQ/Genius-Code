    available: ["Python/Hypothesis verification path"]
    missing: ["estate-wide tool inventory"]
    alternate_routes: []
    failure_modes: []
    improvement_targets: ["bind tool evidence to capability nodes"]
  verification:
    required: ["unit", "property", "fuzz", "static", "dynamic", "formal where applicable"]
    available: ["Hypothesis property verification"]
    missing: ["broad verification harness"]
    alternate_routes: []
    failure_modes: []
    improvement_targets: ["consume Genius-Verification capabilities"]
  observability:
    required: ["logs", "traces", "metrics", "test receipts"]
    available: ["Buildkite receipts"]
    missing: ["runtime performance telemetry"]
    alternate_routes: []
    failure_modes: []
    improvement_targets: ["connect production evidence"]
  reliability_recovery:
    required: ["rollback", "reproduction", "regression prevention"]
    available: ["version control and CI"]
    missing: ["closed-loop repair corpus"]
    alternate_routes: []
    failure_modes: []
    improvement_targets: ["map self-healing repair capability"]
  real_world_effect:
    required: ["working software change", "verified artifact", "deployment when authorized"]
    available: ["repository mutation and CI evidence paths"]
    missing: ["deployment-specific domain routes"]
    alternate_routes: []
    failure_modes: []
    improvement_targets: ["separate code correctness from deployment effect"]
  learning_evolution:
    required: ["failure evidence", "benchmark deltas", "reusable lessons"]
