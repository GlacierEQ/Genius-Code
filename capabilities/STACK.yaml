schema_version: 1
id: genius-code.vertical-excellence
name: Genius Code Vertical Excellence
purpose: Make code mastery executable from compute and runtime primitives through implementation, verification, operations, and production effects.
state: mapped

objective:
  current_reality: "Code mastery scaffold, property-testing seed, source registry, challenge ladder, and Buildkite verification exist."
  desired_reality: "Every important software outcome can be decomposed into substrate, runtime, language, implementation, verification, operational, and deployment capabilities with evidence and reusable higher-order compositions."
  success_conditions:
    - Mission-relevant dependencies are explicit.
    - Working capability is preserved when optional routes degrade.
    - Higher-order compositions add emergent capability rather than instruction duplication.
    - Capability claims are bounded by observed evidence.

layers:
  compute:
    required: ["CPU/GPU/RAM/storage appropriate to the workload"]
    available: ["runtime-dependent"]
    missing: []
    alternate_routes: []
    failure_modes: []
    improvement_targets: ["profile resource bottlenecks by workload"]
  runtime:
    required: ["language runtimes", "compilers/interpreters", "dependency resolution"]
    available: ["Python verification path"]
    missing: ["broad language/runtime inventory"]
    alternate_routes: []
    failure_modes: []
    improvement_targets: ["map Tower-of-Babel and production runtimes"]
  code:
    required: ["source semantics", "algorithms", "data structures", "interfaces", "build systems"]
    available: ["domain map seed", "property-sort implementation evidence"]
    missing: ["broad implementation corpus"]
    alternate_routes: []
    failure_modes: []
    improvement_targets: ["populate reference and production implementations"]
  reasoning:
    required: ["algorithmic reasoning", "systems reasoning", "debugging", "performance reasoning"]
    available: ["model-mediated reasoning"]
    missing: ["benchmarked reasoning routes"]
    alternate_routes: []
    failure_modes: []
    improvement_targets: ["challenge-specific model and method routing"]
  skills:
    required: ["read", "build", "debug", "test", "profile", "repair", "review"]
    available: ["property testing seed"]
    missing: ["full executable skill inventory"]
    alternate_routes: []
    failure_modes: []
    improvement_targets: ["ingest proven Mega/Combo/Skill capabilities"]
  capability_composition:
