    improvement_targets: ["rank primitive improvements by downstream code capability gain"]

dependencies:
  - id: mastery.kernel.capability-anatomy
    relationship: requires
    required_for_current_mission: true
    alternate_routes: []
  - id: mastery.kernel.capability-schema
    relationship: requires
    required_for_current_mission: true
    alternate_routes: []

action:
  preconditions:
    - Domain objective is explicit.
  steps:
    - Decompose the objective through the vertical stack.
    - Discover available skills, tools, connectors, evidence, and alternate routes.
    - Identify mission-sensitive bottlenecks.
    - Compose the strongest executable route.
    - Execute and verify the real effect.
    - Preserve evidence and feed the gain into the next spiral.
  expected_effects:
    - Hidden low-level blockers become exact capability gaps.
    - High-leverage improvements propagate upward.
  postconditions:
    - Current capability state reflects evidence.
  alternate_routes: []
  failure_modes:
    - Treating an unavailable implementation as absence of the capability itself.
  recovery_routes:
    - Discover substitutes and reroute before declaring a scoped blocked state.

verification:
  acceptance:
    - capabilities/STACK.yaml passes the Genius-Mastery structural validator.
    - Material capability claims cite observed evidence before promotion.
  tests: []
  evidence_refs: []
  independent_readback: []

mission_impact:
  mission_relevance: 1.0
  necessity: 1.0
  criticality: 1.0
  sensitivity: 1.0
  substitutability: 0.2
  downstream_centrality: 1.0
  improvement_leverage: 1.0
  rationale: The vertical stack is the reusable substrate for every mission in this Genius domain.

evolution:
  current_bottleneck: "Populate executable capability nodes and connect them to proven skills, tools, Mega Skills, benchmarks, and production evidence."
  improvement_targets:
    - Mega Skills capability ingestion
    - language/runtime inventory
    - code action decomposition
    - benchmark-driven bottleneck ranking
  affected_capabilities: []
  newly_possible_compositions: []
  next_frontier: []
