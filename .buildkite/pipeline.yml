env:
  PYTHON_VERSION: "3.13"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONDONTWRITEBYTECODE: "1"

steps:
  - label: ":python: Contract validate"
    key: validate
    timeout_in_minutes: 10
    command:
      - python --version
      - pip install pyyaml
      - python tools/validate.py .
    plugins:
      - docker#v5.14.0:
          image: "python:3.13-slim"
          always-pull: true
          propagate-environment: true

  - label: ":pytest: Contract unit tests"
    key: unit
    depends_on: validate
    timeout_in_minutes: 10
    command:
      - pip install -r requirements.txt
      - mkdir -p .verification-artifacts
      - pytest -q tests/ --junitxml=.verification-artifacts/junit-unit.xml
    artifact_paths:
      - ".verification-artifacts/junit-unit.xml"
    plugins:
      - docker#v5.14.0:
          image: "python:3.13-slim"
          always-pull: true
          propagate-environment: true

  - label: ":hypothesis: Property-sort evidence"
    key: property-sort
    depends_on: validate
    timeout_in_minutes: 10
    command:
      - pip install -r requirements.txt
      - mkdir -p .verification-artifacts
      - python -m pytest verification/properties/test_sort_properties.py -q --junitxml=.verification-artifacts/junit-property-sort.xml
    artifact_paths:
      - ".verification-artifacts/junit-property-sort.xml"
    plugins:
      - docker#v5.14.0:
          image: "python:3.13-slim"
          always-pull: true
          propagate-environment: true

  - label: ":receipt: Buildkite receipt"
    key: receipt
    depends_on:
      - unit
      - property-sort
    timeout_in_minutes: 5
    command:
      - mkdir -p .verification-artifacts
      - python -c "import datetime,json,os,pathlib; p=pathlib.Path('.verification-artifacts/buildkite-verified-receipt.json'); rec={'schema':'glaciereq.genius-code.buildkite.v1','status':'PASS','commit':os.environ.get('BUILDKITE_COMMIT'),'branch':os.environ.get('BUILDKITE_BRANCH'),'build_id':os.environ.get('BUILDKITE_BUILD_ID'),'build_number':os.environ.get('BUILDKITE_BUILD_NUMBER'),'pipeline':os.environ.get('BUILDKITE_PIPELINE_SLUG'),'generated_at':datetime.datetime.now(datetime.timezone.utc).replace(microsecond=0).isoformat()}; p.write_text(json.dumps(rec,indent=2,sort_keys=True)+'\n')"
    artifact_paths:
      - ".verification-artifacts/buildkite-verified-receipt.json"
    plugins:
      - docker#v5.14.0:
          image: "python:3.13-slim"
          always-pull: true
          propagate-environment: true
