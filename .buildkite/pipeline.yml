env:
  PYTHON_VERSION: "3.13"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONDONTWRITEBYTECODE: "1"

agents:
  queue: macos-self
  os: macos

steps:
  - label: ":lock: Exact source + pipeline preflight"
    key: source-preflight
    timeout_in_minutes: 5
    command: |
      set -euo pipefail
      actual="$(git rev-parse HEAD)"
      test "$actual" = "$BUILDKITE_COMMIT"
      test "$BUILDKITE_PIPELINE_SLUG" = "genius-code"
      git diff --exit-code
      args=(pipeline upload .buildkite/pipeline.yml --dry-run --format yaml)
      help="$(buildkite-agent pipeline upload --help 2>&1)"
      grep -q -- '--reject-parse-warnings' <<<"$help" && args+=(--reject-parse-warnings)
      grep -q -- '--reject-secrets' <<<"$help" && args+=(--reject-secrets)
      buildkite-agent "${args[@]}" >/dev/null

  - label: ":python: Contract validate"
    key: validate
    depends_on: source-preflight
    timeout_in_minutes: 10
    cancel_on_build_failing: true
    retry:
      automatic:
        - exit_status: -1
          limit: 1
        - exit_status: 255
          limit: 1
    command:
      - python --version
      - pip install pyyaml
      - python tools/validate.py .
    plugins:
      - docker#v5.14.0:
          image: "python:3.13-slim"
          always-pull: true
          pull-retries: 2

  - label: ":pytest: Contract unit tests"
    key: unit
    depends_on: validate
    timeout_in_minutes: 10
    cancel_on_build_failing: true
    retry:
      automatic:
        - exit_status: -1
          limit: 1
        - exit_status: 255
          limit: 1
    command:
      - pip install -r requirements.txt
      - mkdir -p .verification-artifacts
      - pytest -q tests/ --junitxml=.verification-artifacts/junit-unit.xml
      - sha256sum .verification-artifacts/junit-unit.xml > .verification-artifacts/junit-unit.xml.sha256
    artifact_paths:
      - ".verification-artifacts/junit-unit.xml"
      - ".verification-artifacts/junit-unit.xml.sha256"
    plugins:
      - docker#v5.14.0:
          image: "python:3.13-slim"
          always-pull: true
          pull-retries: 2

  - label: ":hypothesis: Property-sort evidence"
    key: property-sort
    depends_on: validate
    timeout_in_minutes: 10
    cancel_on_build_failing: true
    retry:
      automatic:
        - exit_status: -1
          limit: 1
        - exit_status: 255
          limit: 1
    command:
      - pip install -r requirements.txt
      - mkdir -p .verification-artifacts
      - python -m pytest verification/properties/test_sort_properties.py -q --junitxml=.verification-artifacts/junit-property-sort.xml
      - sha256sum .verification-artifacts/junit-property-sort.xml > .verification-artifacts/junit-property-sort.xml.sha256
    artifact_paths:
      - ".verification-artifacts/junit-property-sort.xml"
      - ".verification-artifacts/junit-property-sort.xml.sha256"
    plugins:
      - docker#v5.14.0:
          image: "python:3.13-slim"
          always-pull: true
          pull-retries: 2

  - label: ":receipt: Verified terminal receipt"
    key: receipt
    depends_on:
      - unit
      - property-sort
    timeout_in_minutes: 5
    command: |
      set -euo pipefail
      python3 tools/buildkite_receipt.py --repository Genius-Code
    artifact_paths:
      - ".verification-artifacts/buildkite-verified-receipt.json"
      - ".verification-artifacts/buildkite-verified-receipt.json.sha256"
