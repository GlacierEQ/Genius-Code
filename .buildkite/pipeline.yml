env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONDONTWRITEBYTECODE: "1"

agents:
  queue: macos-self
  os: macos

steps:
  - label: ":microscope: Code verified evidence"
    key: verify
    timeout_in_minutes: 15
    cancel_on_build_failing: true
    retry:
      automatic:
        - exit_status: -1
          limit: 1
        - exit_status: 255
          limit: 1
    command: |
      set -euo pipefail
      python3 --version
      python3 - <<'PY'
      import os
      commit = os.environ.get("BUILDKITE_COMMIT", "")
      pipeline = os.environ.get("BUILDKITE_PIPELINE_SLUG", "")
      assert len(commit) == 40, commit
      assert pipeline == "genius-code", pipeline
      PY
      python3 -m venv .venv
      . .venv/bin/activate
      pip install -r requirements.txt
      python3 tools/validate.py .
      python3 -m py_compile tools/buildkite_receipt.py
      mkdir -p .verification-artifacts
      python3 -m pytest -q tests/ --junitxml=.verification-artifacts/junit-unit.xml
      python3 -m pytest verification/properties/test_sort_properties.py -q --junitxml=.verification-artifacts/junit-property-sort.xml
      shasum -a 256 .verification-artifacts/junit-unit.xml > .verification-artifacts/junit-unit.xml.sha256
      shasum -a 256 .verification-artifacts/junit-property-sort.xml > .verification-artifacts/junit-property-sort.xml.sha256
      python3 tools/buildkite_receipt.py \
        --repository Genius-Code \
        --output .verification-artifacts/buildkite-verified-receipt.json \
        --artifact .verification-artifacts/junit-unit.xml \
        --artifact .verification-artifacts/junit-unit.xml.sha256 \
        --artifact .verification-artifacts/junit-property-sort.xml \
        --artifact .verification-artifacts/junit-property-sort.xml.sha256 \
        --proof .buildkite/pipeline.yml
    artifact_paths:
      - ".verification-artifacts/junit-unit.xml"
      - ".verification-artifacts/junit-unit.xml.sha256"
      - ".verification-artifacts/junit-property-sort.xml"
      - ".verification-artifacts/junit-property-sort.xml.sha256"
      - ".verification-artifacts/buildkite-verified-receipt.json"
      - ".verification-artifacts/buildkite-verified-receipt.json.sha256"
