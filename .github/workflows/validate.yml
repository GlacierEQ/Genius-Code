name: validate-contract

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install repository dependencies
        run: pip install -r requirements.txt
      - name: Validate Genius contract
        run: python tools/validate.py .
      - name: Run contract and property regressions
        run: pytest -q
